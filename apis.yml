name: Relation Rx
description: >-
  Relation Therapeutics (Relation Rx) is a London- and Boston-based end-to-end
  biotechnology company developing transformational medicines with technology at
  its core. The company combines single-cell multi-omics analysis of patient
  tissue, functional genomics and disease-relevant assays, and machine learning
  to decode disease biology, identify and validate therapeutic targets, and
  advance its own pipeline of drug candidates. Relation is a DCVC portfolio
  company and has announced research collaborations with partners including
  Novartis. It operates as a therapeutics developer rather than a software or
  API provider, and publishes no public developer API, developer portal, SDKs,
  or machine-readable API specifications at this time.
